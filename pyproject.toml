[project]
name = "experts"
version = "0.1.0"
description = "Compagnon de code local : spécialistes Python, Docker, Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
cloud = ["anthropic>=2.6"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "anthropic>=2.6"]

[project.scripts]
experts = "experts.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["experts*"]

[tool.setuptools.package-data]
experts = ["assets/**/*.svg", "companions/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
